# Builds moneta/ and deploys to GitHub Pages (environment: github-pages).
# In the Actions tab this often appears as "pages build and deployment".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: moneta/package-lock.json

      - name: Install and build
        working-directory: moneta
        run: npm ci && npm run build

      # GitHub Pages serves 404.html for unknown paths — copy SPA shell for client routing.
      - name: SPA fallback (404.html)
        working-directory: moneta/dist
        run: cp index.html 404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: moneta/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
