name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-moneta:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moneta

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: moneta/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint omitted until eslint is clean project-wide (npm run lint).
      - name: Build
        run: npm run build
